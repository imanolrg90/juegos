<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scattergories</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, #ffe29a 0%, #ffad66 35%, #c94c4c 100%);
      color: #25140f;
    }
    .card {
      width: min(92vw, 560px);
      background: rgba(255, 246, 230, 0.92);
      border: 3px solid #8f2d2d;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.25);
      text-align: center;
    }
    h1 {
      margin-top: 0;
      font-size: 2.4rem;
      letter-spacing: 0.02em;
    }
    p { color: #5a2e1f; }
    .actions {
      margin-top: 18px;
      display: grid;
      gap: 12px;
    }
    a {
      text-decoration: none;
      font-weight: 800;
      border-radius: 14px;
      padding: 14px;
      color: white;
      background: linear-gradient(135deg, #8f2d2d, #d44630);
      box-shadow: 0 8px 18px rgba(128, 26, 26, 0.35);
    }
    a:last-child {
      background: linear-gradient(135deg, #1f4f8b, #2f7fbd);
      box-shadow: 0 8px 18px rgba(24, 67, 125, 0.35);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Scattergories</h1>
    <p>Elige la pantalla que vas a usar.</p>
    <div class="actions">
      <a href="scattergories-tv.html">Pantalla Host (TV)</a>
      <a href="scattergories-control.html">Movil Jugador</a>
    </div>
  </main>
</body>
</html>
