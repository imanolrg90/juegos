<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scattergories TV</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg-1: #081f2c;
      --bg-2: #133b5c;
      --ink: #fff7ea;
      --muted: #e8d7bc;
      --paper: #fff9ee;
      --accent: #ff8f3f;
      --good: #148f77;
      --mid: #d6a50b;
      --bad: #9f2f2f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Verdana", "Segoe UI", sans-serif;
      background:
        radial-gradient(1000px 580px at 5% -10%, #285d7a 0%, transparent 60%),
        radial-gradient(1000px 560px at 105% 120%, #9f5b2b 0%, transparent 55%),
        linear-gradient(120deg, var(--bg-1), var(--bg-2));
      padding: 22px;
    }
    .wrap { max-width: 1320px; margin: 0 auto; }
    .hidden { display: none !important; }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }
    .title {
      font-size: clamp(1.6rem, 3.2vw, 2.9rem);
      margin: 0;
      letter-spacing: 0.02em;
    }
    .pill {
      border: 2px solid rgba(255, 247, 234, 0.35);
      border-radius: 999px;
      padding: 8px 16px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.07);
    }
    .panel {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 247, 234, 0.22);
      border-radius: 20px;
      padding: 16px;
      backdrop-filter: blur(8px);
    }
    .lobby-layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 16px;
    }
    .qr-box {
      background: var(--paper);
      color: #2e190f;
      border-radius: 16px;
      padding: 14px;
      text-align: center;
    }
    #qrcode { display: flex; justify-content: center; }
    .players {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    .player {
      border-radius: 14px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 10px;
      text-align: center;
      font-weight: 700;
      min-height: 84px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 7px;
    }
    .ready { color: #9df4c7; }
    .not-ready { color: #ffd9ae; }
    button {
      border: 0;
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      color: white;
      background: linear-gradient(130deg, #de5b34, #f19f29);
    }
    button.secondary {
      background: linear-gradient(130deg, #3a7bb2, #2b9bc6);
    }
    button.warn {
      background: linear-gradient(130deg, #8f2f2f, #c94141);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }

    .play-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 16px;
      align-items: start;
    }
    .letter-stage {
      background: rgba(255, 249, 238, 0.92);
      color: #2e190f;
      border-radius: 20px;
      padding: 16px;
      text-align: center;
    }
    .letter-die {
      margin: 8px auto;
      width: 120px;
      height: 120px;
      border-radius: 20px;
      border: 3px solid #2e190f;
      display: grid;
      place-items: center;
      font-size: 4rem;
      font-weight: 900;
      background: linear-gradient(145deg, #ffd39a, #ffefcc);
      box-shadow: 0 8px 0 #c07a3d;
    }
    .rolling {
      animation: wobble 0.12s linear infinite;
    }
    @keyframes wobble {
      0% { transform: rotate(-2deg) scale(0.98); }
      50% { transform: rotate(2deg) scale(1.03); }
      100% { transform: rotate(-2deg) scale(0.98); }
    }
    .topics {
      display: grid;
      gap: 8px;
    }
    .topic-row {
      display: grid;
      grid-template-columns: 32px 1fr;
      gap: 8px;
      align-items: center;
      border-radius: 12px;
      padding: 8px;
      background: rgba(255,255,255,0.06);
    }

    .review-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 10px;
    }
    .answer-grid {
      display: grid;
      gap: 8px;
    }
    .answer-card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 14px;
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }
    .chips { display: flex; gap: 6px; }
    .chip {
      border-radius: 999px;
      border: 1px solid transparent;
      padding: 6px 10px;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      color: #1d130e;
      background: #f4d9b6;
    }
    .chip.active.correct { background: #6be1b6; }
    .chip.active.duplicate { background: #f4d66d; }
    .chip.active.incorrect { background: #f08b8b; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      background: rgba(255,255,255,0.06);
      border-radius: 12px;
      overflow: hidden;
    }
    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.15);
    }
    tr:last-child td { border-bottom: 0; }

    @media (max-width: 980px) {
      .lobby-layout, .play-layout { grid-template-columns: 1fr; }
      .review-head { grid-template-columns: 1fr; }
      .answer-card { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h1 class="title">Scattergories Host</h1>
      <div class="pill" id="phasePill">Lobby</div>
    </div>

    <section id="viewLobby" class="panel">
      <div class="lobby-layout">
        <div>
          <div class="qr-box">
            <h3 style="margin-top:0;">Unirse desde movil</h3>
            <div id="qrcode"></div>
            <p id="joinUrl" style="margin-bottom:0;font-size:0.9rem;word-break:break-all;"></p>
          </div>
          <div class="row" style="margin-top:12px;">
            <button id="startBtn">Empezar ronda</button>
            <button class="warn" id="resetAllBtn">Reiniciar sala</button>
          </div>
          <p id="lobbyHint" style="color:var(--muted);margin-bottom:0;">Todos deben pulsar Estoy listo.</p>
        </div>
        <div>
          <h2 style="margin-top:0;">Jugadores</h2>
          <div class="players" id="playersLobby"></div>
        </div>
      </div>
    </section>

    <section id="viewPlaying" class="panel hidden">
      <div class="play-layout">
        <div class="letter-stage">
          <h2 style="margin:0;">Dado de letras</h2>
          <div class="letter-die" id="letterDie">?</div>
          <div style="font-weight:800;font-size:1.1rem;">Letra final: <span id="finalLetter">-</span></div>
          <p style="margin-bottom:6px;">Tiempo restante</p>
          <div style="font-size:2.2rem;font-weight:900;" id="timer">03:00</div>
          <button class="secondary" id="forceReviewBtn" style="margin-top:8px;">Pasar a revision</button>
        </div>
        <div>
          <h2 style="margin-top:0;">Temas de esta ronda</h2>
          <p style="margin-top:0;color:var(--muted);" id="setName"></p>
          <div class="topics" id="topicsList"></div>
          <h3>Entregas</h3>
          <div class="players" id="playersPlaying"></div>
        </div>
      </div>
    </section>

    <section id="viewReview" class="panel hidden">
      <div class="review-head">
        <div>
          <h2 style="margin:0;">Revision de respuestas</h2>
          <p style="margin:6px 0 0; color:var(--muted);" id="reviewTopicLabel"></p>
        </div>
        <div class="row">
          <button class="secondary" id="prevTopicBtn">Tema anterior</button>
          <button class="secondary" id="nextTopicBtn">Siguiente tema</button>
          <button id="finishRoundBtn">Cerrar ronda</button>
        </div>
      </div>
      <div class="answer-grid" id="answersReview"></div>
    </section>

    <section id="viewResults" class="panel hidden">
      <h2 style="margin-top:0;">Resultados de la ronda</h2>
      <table>
        <thead><tr><th>Jugador</th><th>Ronda</th><th>Total</th></tr></thead>
        <tbody id="resultsBody"></tbody>
      </table>
      <div class="row" style="margin-top:12px;">
        <button id="newRoundBtn" class="secondary">Nueva ronda (volver a lobby)</button>
      </div>
    </section>
  </div>

  <script>
    const LETTERS = "ABCDEFGHIJKLMNOPRSTW".split("");
    const POLL_MS = 1000;

    const phasePill = document.getElementById("phasePill");
    const viewLobby = document.getElementById("viewLobby");
    const viewPlaying = document.getElementById("viewPlaying");
    const viewReview = document.getElementById("viewReview");
    const viewResults = document.getElementById("viewResults");

    const playersLobby = document.getElementById("playersLobby");
    const playersPlaying = document.getElementById("playersPlaying");
    const topicsList = document.getElementById("topicsList");
    const timerEl = document.getElementById("timer");
    const setName = document.getElementById("setName");

    const letterDie = document.getElementById("letterDie");
    const finalLetter = document.getElementById("finalLetter");

    const reviewTopicLabel = document.getElementById("reviewTopicLabel");
    const answersReview = document.getElementById("answersReview");
    const resultsBody = document.getElementById("resultsBody");

    let currentState = null;
    let reviewTopicIndex = 0;
    let rollingInterval = null;
    let hasSettledLetter = false;

    function esc(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function fmtSeconds(s) {
      const min = Math.floor(s / 60).toString().padStart(2, "0");
      const sec = Math.floor(s % 60).toString().padStart(2, "0");
      return min + ":" + sec;
    }

    function setView(phase) {
      phasePill.textContent = phase.toUpperCase();
      viewLobby.classList.toggle("hidden", phase !== "lobby");
      viewPlaying.classList.toggle("hidden", phase !== "playing");
      viewReview.classList.toggle("hidden", phase !== "review");
      viewResults.classList.toggle("hidden", phase !== "results");
    }

    function renderPlayerCard(p, withKick) {
      const status = p.ready ? "Listo" : "Esperando";
      const statusClass = p.ready ? "ready" : "not-ready";
      const submitText = p.submitted ? "Enviado" : "En juego";
      const btnKick = withKick ? `<button class="warn" style="padding:6px 8px;font-size:0.8rem;" onclick="kickPlayer('${esc(p.name)}')">Expulsar</button>` : "";
      return `
        <div class="player">
          <div>${esc(p.name)}</div>
          <div class="${statusClass}">${status}</div>
          <div style="font-size:0.8rem;opacity:0.9;">${submitText}</div>
          ${btnKick}
        </div>
      `;
    }

    function renderLobby(state) {
      const allReady = state.players.length >= 2 && state.players.every(p => p.ready);
      playersLobby.innerHTML = state.players.map(p => renderPlayerCard(p, true)).join("");
      document.getElementById("startBtn").disabled = !allReady;
      document.getElementById("lobbyHint").textContent = allReady
        ? "Todo listo. Puedes iniciar la ronda."
        : "Todos deben pulsar Estoy listo (minimo 2 jugadores).";
    }

    function renderPlaying(state) {
      setName.textContent = "Lista seleccionada: " + (state.topic_set_name || "-");
      timerEl.textContent = fmtSeconds(state.time_left || 0);
      topicsList.innerHTML = (state.topics || []).map((t, i) => `
        <div class="topic-row"><b>${i + 1}</b><span>${esc(t)}</span></div>
      `).join("");
      playersPlaying.innerHTML = state.players.map(p => renderPlayerCard(p, false)).join("");

      if (!hasSettledLetter && state.letter) {
        startLetterRoll(state.letter);
        hasSettledLetter = true;
      }
    }

    function startLetterRoll(finalL) {
      letterDie.classList.add("rolling");
      finalLetter.textContent = "-";
      rollingInterval = setInterval(() => {
        letterDie.textContent = LETTERS[Math.floor(Math.random() * LETTERS.length)];
      }, 70);

      setTimeout(() => {
        clearInterval(rollingInterval);
        rollingInterval = null;
        letterDie.classList.remove("rolling");
        letterDie.textContent = finalL;
        finalLetter.textContent = finalL;
      }, 1800);
    }

    function buildEvalButton(topicIndex, playerName, key, label) {
      const evalMap = (currentState.evaluations || {});
      const topicData = evalMap[String(topicIndex)] || {};
      const current = topicData[playerName] ? topicData[playerName].result : "incorrect";
      const active = current === key ? `active ${key}` : "";
      return `<button class="chip ${active}" onclick="setEvaluation(${topicIndex}, '${playerName}', '${key}')">${label}</button>`;
    }

    function renderReview(state) {
      const topics = state.topics || [];
      if (reviewTopicIndex >= topics.length) reviewTopicIndex = Math.max(0, topics.length - 1);
      const t = topics[reviewTopicIndex] || "";
      reviewTopicLabel.textContent = `Tema ${reviewTopicIndex + 1}: ${t} | Letra ${state.letter || "-"}`;

      answersReview.innerHTML = state.players.map((p) => {
        const answer = (p.name && findPlayerAnswers(p.name)[reviewTopicIndex]) || "";
        return `
          <div class="answer-card">
            <div>
              <div style="font-weight:800;">${esc(p.name)}</div>
              <div style="opacity:0.9;">${esc(answer || "(sin respuesta)")}</div>
            </div>
            <div class="chips">
              ${buildEvalButton(reviewTopicIndex, p.name, "incorrect", "0 Incorrecta")}
              ${buildEvalButton(reviewTopicIndex, p.name, "duplicate", "5 Repetida")}
              ${buildEvalButton(reviewTopicIndex, p.name, "correct", "10 Valida")}
            </div>
          </div>
        `;
      }).join("");
    }

    function renderResults(state) {
      const sorted = [...state.players].sort((a, b) => b.score - a.score);
      resultsBody.innerHTML = sorted.map((p) => `
        <tr>
          <td>${esc(p.name)}</td>
          <td>${p.round_score}</td>
          <td><b>${p.score}</b></td>
        </tr>
      `).join("");
    }

    function findPlayerAnswers(name) {
      if (!window.playerAnswersCache) return [];
      return window.playerAnswersCache[name] || [];
    }

    async function refresh() {
      const res = await fetch("/api/scattergories/state");
      if (!res.ok) return;
      const state = await res.json();
      currentState = state;

      setView(state.phase);
      if (state.phase !== "playing") {
        hasSettledLetter = false;
      }

      if (state.phase === "lobby") renderLobby(state);
      if (state.phase === "playing") renderPlaying(state);

      await refreshAnswersCache();

      if (state.phase === "review") renderReview(state);
      if (state.phase === "results") renderResults(state);
    }

    async function refreshAnswersCache() {
      if (!currentState || !currentState.players) return;
      if (!["review", "results"].includes(currentState.phase)) return;

      window.playerAnswersCache = window.playerAnswersCache || {};
      await Promise.all(currentState.players.map(async (p) => {
        const r = await fetch("/api/scattergories/player?name=" + encodeURIComponent(p.name));
        if (r.ok) {
          const data = await r.json();
          window.playerAnswersCache[p.name] = data.answers || [];
        }
      }));
    }

    async function setEvaluation(topicIndex, playerName, result) {
      await fetch("/api/scattergories/evaluate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ topicIndex, playerName, result })
      });
      refresh();
    }

    async function kickPlayer(name) {
      if (!confirm("Expulsar a " + name + " del lobby?")) return;
      await fetch("/api/scattergories/kick", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name })
      });
      refresh();
    }

    document.getElementById("startBtn").addEventListener("click", async () => {
      const res = await fetch("/api/scattergories/start", { method: "POST" });
      if (!res.ok) {
        const err = await res.json();
        alert(err.error || "No se pudo iniciar");
      }
      refresh();
    });

    document.getElementById("resetAllBtn").addEventListener("click", async () => {
      if (!confirm("Reiniciar la sala completa?")) return;
      await fetch("/api/scattergories/reset", { method: "POST" });
      refresh();
    });

    document.getElementById("forceReviewBtn").addEventListener("click", async () => {
      await fetch("/api/scattergories/force-review", { method: "POST" });
      refresh();
    });

    document.getElementById("prevTopicBtn").addEventListener("click", () => {
      reviewTopicIndex = Math.max(0, reviewTopicIndex - 1);
      if (currentState) renderReview(currentState);
    });

    document.getElementById("nextTopicBtn").addEventListener("click", () => {
      const maxIndex = Math.max(0, (currentState?.topics?.length || 1) - 1);
      reviewTopicIndex = Math.min(maxIndex, reviewTopicIndex + 1);
      if (currentState) renderReview(currentState);
    });

    document.getElementById("finishRoundBtn").addEventListener("click", async () => {
      await fetch("/api/scattergories/finish", { method: "POST" });
      refresh();
    });

    document.getElementById("newRoundBtn").addEventListener("click", async () => {
      await fetch("/api/scattergories/new-round", { method: "POST" });
      reviewTopicIndex = 0;
      refresh();
    });

    function initQr() {
      const joinUrl = window.location.origin + "/scattergories/scattergories-control.html";
      document.getElementById("joinUrl").textContent = joinUrl;
      new QRCode(document.getElementById("qrcode"), {
        text: joinUrl,
        width: 180,
        height: 180,
        colorDark: "#101010",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    initQr();
    refresh();
    setInterval(refresh, POLL_MS);
  </script>
</body>
</html>
