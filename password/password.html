<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PASSWORD | GameRoom</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="password.css">
</head>
<body>
    <div class="container">
        <aside class="panel left-panel">
            <div>
                <h1 class="header-title">PASSWORD</h1>
                <p id="progressDisplay" class="progress-info">Configura la partida</p>
            </div>

            <div id="setup-area" class="team-creation-box">
                <div class="config-row">
                    <div class="config-card">
                        <label>TIEMPO (SEG)</label>
                        <input type="number" id="time-config" value="60" min="10" class="config-input">
                    </div>
                    <div class="config-card">
                        <label>RONDAS</label>
                        <input type="number" id="rounds-config" value="5" min="1" class="config-input">
                    </div>
                </div>

                <div class="input-wrapper" style="margin-top: 20px;">
                    <input type="text" id="team-name" placeholder="Nuevo Equipo..." class="team-input">
                    <button onclick="addTeam()" class="btn-add-plus">+</button>
                </div>
            </div>

            <button id="stop-btn" class="btn btn-stop" style="display:none;" onclick="endTurnManual()">
                🛑 TERMINAR TURNO
            </button>

            <div id="scoreboard" class="scoreboard-list custom-scroll">
                </div>

            <div class="controls-area">
                <button id="start-game-btn" class="btn btn-primary" style="display:none;" onclick="startGame()">
                    🚀 EMPEZAR PARTIDA
                </button>
                <a href="../index.html" class="btn btn-back">
                    <span>←</span> SALIR
                </a>
            </div>
        </aside>

        <main class="panel right-panel">
            
            <div id="welcome-screen" class="game-display">
                <div class="big-icon">🔐</div>
                <h2>Juego de Password</h2>
                <p>Un jugador da pistas, el equipo adivina.</p>
            </div>

            <div id="prep-screen" class="game-display" style="display:none;">
                <div class="turn-badge">TURNO DE</div>
                <h1 id="next-team-label" class="team-highlight">EQUIPO 1</h1>
                <div class="round-info">RONDA <span id="current-round-display">1</span></div>
                <button class="btn btn-reveal" onclick="startTurn()">▶ COMENZAR CUENTA ATRÁS</button>
            </div>

            <div id="game-screen" class="game-display" style="display:none;">
                <div class="timer-bar">
                    <div id="timer-fill" class="timer-fill"></div>
                </div>
                <div class="timer-text" id="timer-text">60</div>

                <div class="word-container">
                    <h1 id="current-word" class="main-word">...</h1>
                </div>

                <div class="actions-grid">
                    <button class="action-btn btn-fail" onclick="handleAction('fail')">
                        <span>✕</span>
                        <div class="btn-label">FALLO (-1)</div>
                    </button>
                    
                    <button class="action-btn btn-pass" onclick="handleAction('pass')">
                        <span>➜</span>
                        <div class="btn-label">PASAR</div>
                    </button>

                    <button class="action-btn btn-success" onclick="handleAction('success')">
                        <span>✓</span>
                        <div class="btn-label">ACIERTO (+1)</div>
                    </button>
                </div>
            </div>

            <div id="game-over-screen" class="game-display" style="display:none;">
                <div class="big-icon">🏆</div>
                <h2>¡JUEGO TERMINADO!</h2>
                <h1 id="winner-name" class="winner-text">GANADOR</h1>
                <div id="final-scores" class="final-scores-list"></div>
                <button class="btn btn-primary" onclick="resetGameFull()">JUGAR OTRA VEZ</button>
            </div>
        </main>
    </div>

    <div id="emojiModal" class="emoji-modal-overlay">
        <div class="emoji-modal-content">
            <h2>Elige un Icono</h2>
            <div id="emojiGrid" class="emoji-grid-select"></div>
            <button class="btn-close-modal" onclick="closeEmojiModal()">Cancelar</button>
        </div>
    </div>

    <script src="password.js"></script>
</body>
</html>
